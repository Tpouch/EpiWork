sonar.projectKey=Kernyx-Labs_EpiWork_f484b4a1-aa11-4b2f-bac7-3023a37a5d2b

# React 19 no longer checks propTypes at runtime, so S6774 would only ask for dead code.
sonar.issue.ignore.multicriteria=propTypes,fontsIntegrity
sonar.issue.ignore.multicriteria.propTypes.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.propTypes.resourceKey=frontend/**/*.jsx
# Google Fonts serves user-agent specific CSS, so an integrity hash cannot be pinned.
sonar.issue.ignore.multicriteria.fontsIntegrity.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.fontsIntegrity.resourceKey=frontend/index.html

# The frontend is verified by manual click-through and the backend unit tests target
# domain logic and middleware, so the HTTP wiring layers are left out of coverage.
sonar.coverage.exclusions=frontend/**,backend/prisma/**,backend/prisma.config.js,backend/src/index.js,backend/src/db.js,backend/src/routes/**,**/*.test.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
