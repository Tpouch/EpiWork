services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - backend-prisma:/app/prisma

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:4000
    depends_on:
      - backend

volumes:
  backend-prisma:
